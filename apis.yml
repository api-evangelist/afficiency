  reason: customer-only-docs
  detail: >-
    Afficiency markets a "robust RESTful API suite" for quote-to-policy-issue but points every
    documentation request at support.afficiency.com, a HubSpot customer portal that returns HTTP 404
    to anonymous clients on its own root, while api.afficiency.com sits behind Cloudflare with an
    origin that never answers (HTTP 522) — so the contract exists only for signed customers and the
    only public route to it is the Book a Demo form.
