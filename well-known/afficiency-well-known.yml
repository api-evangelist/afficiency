# Not a /.well-known/ document, but a real machine-readable consent signal the provider DOES publish.
# Saved verbatim to well-known/afficiency-robots.txt and pointed at from apis.yml as type ContentSignal.
content_signals:
  - host: www.afficiency.com
    path: /robots.txt
    status: 200
    file: afficiency-robots.txt
    fetched: '2026-09-12'
    directive: 'Content-Signal: search=yes,ai-train=no,use=reference'
    applies_to: 'User-agent: *'
    framework: Cloudflare Content Signals Policy
    reserves_rights_under: EU Directive 2019/790 Article 4 (text and data mining opt-out)
    interpretation: >-
      Indexing for search is permitted; using the content to train or fine-tune AI models is refused;
      AI consumption is permitted at the "reference" level. `ai-input` is not declared either way.
    named_crawlers_disallowed:
      - Amazonbot
      - Applebot-Extended
      - Bytespider
      - CCBot
      - ClaudeBot
      - CloudflareBrowserRenderingCrawler
      - Google-Extended
      - GPTBot
      - meta-externalagent
    note: >-
      Nine named AI crawlers are Disallow: / while the wildcard agent is Allow: /. This profile was
      built with ordinary anonymous HTTP requests against the wildcard-allowed surface; none of the
      disallowed agents were used and no access control was defeated.

  - host: afficiency.com
    path: /llms.txt
    status: 404
    file: null
  - host: www.afficiency.com
    path: /llms.txt
    status: 404
    file: null
